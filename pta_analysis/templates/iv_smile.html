


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA期权隐波微笑曲线</title>
<script src="/static/js/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 12px;
  }

  /* ===== 顶栏 ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .header h2 { color: #00d4ff; font-size: 16px; }
  .status-bar { display: flex; gap: 24px; font-size: 13px; }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .status-label { color: #888; }
  .status-value { color: #00ff88; font-weight: 600; }
  .status-value.warn { color: #ffaa00; }
  .status-value.error { color: #ff4444; }

  /* ===== 指标栏（1行5列）===== */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .metric-box {
    background: #12121a;
    border: 1px solid #2a2a4a;
    border-radius: 6px;
    padding: 8px 6px;
    text-align: center;
  }
  .metric-name { font-size: 10px; color: #666; margin-bottom: 4px; }
  .metric-value { font-size: 16px; font-weight: 600; }
  .metric-sub { font-size: 10px; color: #444; margin-top: 2px; }

  /* ===== 图表区（2列并排）===== */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card {
    background: #12121a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 10px;
  }
  .card-title {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== T型表格 ===== */
  .t-table-wrap { margin-top: 10px; padding: 0 2px; max-height: 480px; overflow-y: auto; }
  .t-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  .t-table thead {
    background: #1a1a2e;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .t-table th {
    padding: 6px 8px;
    font-weight: 500;
    font-size: 11px;
    color: #666;
    text-align: right;
    border-bottom: 2px solid #2a2a4a;
  }
  /* 对称列宽：Call 4列 | 行权价 | Put 4列 */
  .t-table colgroup .col-oi   { width: 14%; }
  .t-table colgroup .col-oichg { width: 10%; }
  .t-table colgroup .col-iv   { width: 10%; }
  .t-table colgroup .col-ivchg { width: 10%; }
  .t-table colgroup .col-strike { width: 12%; }
  .t-table th.call-h { color: #00d4ff; }
  .t-table th.put-h { color: #ff6b9d; }
  .t-table th.center-h { color: #ffaa00; text-align: center; }
  .t-table td {
    padding: 4px 8px;
    text-align: right;
    color: #ccc;
    border-bottom: 1px solid #1a1a2a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 行权价居中（第5列） */
  .t-table td:nth-child(5) { text-align: center; color: #ffaa00; font-weight: 600; }
  .t-table tr:hover { background: #1a1a2e; }
  .t-table tr.atm-row { background: #1a2a1a; }
  .t-table tr.atm-row:hover { background: #1f3020; }

  /* T型表格颜色 */
  .iv-call { color: #00d4ff; }
  .iv-put { color: #ff6b9d; }
  .iv-up { color: #ff4444; }
  .iv-down { color: #00d4ff; }
  .iv-flat { color: #555; }
  .iv-smooth { color: #ffaa00; }
  .star { color: #ffaa00; margin-right: 2px; }

  /* ===== 异动色块标注（背景色 + 统一白色文字） ===== */
  .alert-significant {
    background: rgba(255, 136, 0, 0.25);
    border-radius: 3px;
    padding: 1px 4px;
    color: #ffcc66;
  }
  .alert-major {
    background: rgba(255, 34, 34, 0.35);
    border-radius: 3px;
    padding: 1px 4px;
    color: #ff8888;
  }
  .alert-reversal {
    background: rgba(255, 0, 255, 0.3);
    border-radius: 3px;
    padding: 1px 4px;
    color: #ff88ff;
    animation: pulse-reversal 0.8s ease-in-out infinite;
  }
  /* 反转叠加闪烁：保留原色块(major/significant)颜色，加闪烁动画 */
  .alert-reversal-pulse {
    animation: pulse-reversal 0.8s ease-in-out infinite;
  }

  /* 闪烁动画 */
  @keyframes blink-reversal {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes pulse-reversal {
    0%, 100% { background: rgba(255, 0, 255, 0.35); box-shadow: 0 0 4px rgba(255, 0, 255, 0.4); }
    50% { background: rgba(255, 0, 255, 0.12); box-shadow: none; }
  }
  @keyframes pulse-major {
    0%, 100% { background: rgba(255, 34, 34, 0.35); }
    50% { background: rgba(255, 34, 34, 0.15); }
  }
  @keyframes blink-major {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .blink-major { animation: blink-major 1s ease-in-out 3; }

  /* ===== Toast 弹窗 ===== */
  .toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 80vh;
    overflow-y: auto;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    min-width: 280px;
    max-width: 400px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    animation: toast-in 0.3s ease-out;
    cursor: pointer;
  }
  .toast.significant {
    background: linear-gradient(135deg, #2a1a00, #1a1200);
    border: 1px solid #ff8800;
    color: #ffcc66;
  }
  .toast.major {
    background: linear-gradient(135deg, #2a0000, #1a0000);
    border: 1px solid #ff2222;
    color: #ff6666;
    animation: toast-in 0.3s ease-out, blink-major 1s ease-in-out 3;
  }
  .toast.reversal {
    background: linear-gradient(135deg, #2a002a, #1a001a);
    border: 1px solid #ff00ff;
    color: #ff88ff;
    animation: toast-in 0.3s ease-out, pulse-reversal 0.8s ease-in-out 5;
  }
  .toast .toast-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .toast .toast-detail {
    font-size: 12px;
    color: #bbb;
  }
  .toast .toast-close {
    float: right;
    cursor: pointer;
    font-size: 16px;
    color: #888;
    margin-left: 8px;
    line-height: 1;
  }
  .toast .toast-close:hover {
    color: #fff;
  }
  @keyframes toast-in {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== 辅助 ===== */
  .legend-row {
    display: flex;
    gap: 16px;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-dot.current { background: #ffaa00; }
  .legend-dot.call { background: #00d4ff; }
  .legend-dot.put { background: #ff6b9d; }
  .legend-dot.prev { background: #8888ff; }
  .legend-text { color: #aaa; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 4px; }
  .badge-up { background: rgba(255,68,68,0.2); color: #ff4444; }
  .badge-down { background: rgba(0,212,255,0.2); color: #00d4ff; }
  .badge-flat { background: rgba(136,136,136,0.2); color: #888; }

  .footer {
    margin-top: 10px;
    text-align: center;
    font-size: 11px;
    color: #333;
  }
  .btn {
    background: #1a4a8a;
    color: #00d4ff;
    border: 1px solid #2a6aba;
    padding: 4px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .btn:hover { background: #2a6aba; }
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: #444;
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="header">
  <h2>📊 PTA期权隐波微笑曲线</h2>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">期货价</span>
        <span class="status-value" id="fPrice">--</span>
      </div>
      <div class="status-item">
        <span class="status-label">ATM</span>
        <span class="status-value" id="atmStrikeTop">--</span>
      </div>
      <div class="status-item">
        <span class="status-label">最大痛点</span>
        <span class="status-value" id="maxPain">--</span>
      </div>
      <div class="status-item">
        <span class="status-label">到期日</span>
        <span class="status-value" id="expiry">--</span>
      </div>
      <div class="status-item">
        <span class="status-label">前次基准</span>
        <span class="status-value" id="prevTime">--</span>
      </div>
    </div>
    <button class="btn" onclick="triggerCalc()">🔄 刷新</button>
  </div>
</div>

<!-- ===== 指标栏（1行4列）===== -->
<div class="metric-grid">
  <div class="metric-box">
    <div class="metric-name">ATM 隐波</div>
    <div class="metric-value" id="mAtmIv" style="color:#ffaa00;">--</div>
    <div class="metric-sub" id="mAtmDiffSub">--</div>
  </div>
  <div class="metric-box">
    <div class="metric-name">偏斜度 Skew</div>
    <div class="metric-value" id="mSkewParam" style="color:#ff6b9d;">--</div>
    <div class="metric-sub" id="mSkewSub">dσ/dk at ATM</div>
  </div>
  <div class="metric-box">
    <div class="metric-name">曲线形态</div>
    <div class="metric-value" id="mShape" style="color:#aaffaa;">--</div>
    <div class="metric-sub" id="mShapeSub">整体平移</div>
  </div>
  <div class="metric-box">
    <div class="metric-name">曲率 Curvature</div>
    <div class="metric-value" id="mCurvature" style="color:#aaffaa;">--</div>
    <div class="metric-sub" id="mCurvSub">微笑弯曲程度</div>
  </div>
  <div class="metric-box">
    <div class="metric-name">拟合残差</div>
    <div class="metric-value" id="mFitErr" style="color:#888;">--</div>
    <div class="metric-sub">RMSE</div>
  </div>
</div>

<!-- ===== 图表区（2列并排）===== -->
<div class="chart-grid">
  <!-- 左：隐含波动率微笑曲线 -->
  <div class="card">
    <div class="card-title">隐含波动率微笑曲线</div>
    <div id="smileChart" style="width:100%;height:290px;"></div>
  </div>
  <!-- 右：ATM IV 走势图 -->
  <div class="card">
    <div class="card-title">ATM IV 走势图</div>
    <div id="atmChart" style="width:100%;height:260px;"></div>
  </div>
</div>

<!-- ===== T型表格 ===== -->
<div class="t-table-wrap">
  <div class="card-title" style="margin-bottom:8px;">分档隐波明细</div>
  <table class="t-table">
    <colgroup>
      <col class="col-oichg">
      <col class="col-oi">
      <col class="col-ivchg">
      <col class="col-iv">
      <col class="col-strike">
      <col class="col-iv">
      <col class="col-ivchg">
      <col class="col-oi">
      <col class="col-oichg">
    </colgroup>
    <thead>
      <tr>
        <th class="call-h">持仓变化</th>
        <th class="call-h">Call持仓</th>
        <th class="call-h">IV变化</th>
        <th class="call-h">Call IV</th>
        <th class="center-h">行权价</th>
        <th class="put-h">Put IV</th>
        <th class="put-h">IV变化</th>
        <th class="put-h">Put持仓</th>
        <th class="put-h">持仓变化</th>
      </tr>
    </thead>
    <tbody id="tBody">
      <tr><td colspan="9" style="text-align:center;color:#444;height:80px;">暂无数据</td></tr>
    </tbody>
  </table>
</div>

<div class="footer">
  <span id="lastUpdate">--</span>
</div>

<script>
// ===================== 全局图表实例 =====================
const chartInstances = {};
let _atmHistory = [];

// ===================== 通用主题 =====================
const chartTheme = {
  backgroundColor: 'transparent',
  textStyle: { color: '#888', fontSize: 11 },
};

// ===================== 初始化图表 =====================
function initCharts() {
  // 1. 微笑曲线（散点 + 平滑 + 15:00基准虚线）
  const smileEl = document.getElementById('smileChart');
  const smileChart = echarts.init(smileEl, null, { renderer: 'canvas' });
  chartInstances.smile = smileChart;
  smileChart.setOption({
    ...chartTheme,
    legend: {
      show: true,
      top: 2, right: 10,
      textStyle: { color: '#888', fontSize: 10 },
      itemWidth: 16, itemHeight: 8, itemGap: 14,
      selectedMode: true,
    },
    grid: { top: 30, right: 15, bottom: 25, left: 50 },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', crossStyle: { color: '#555' } },
      backgroundColor: 'rgba(20,20,35,0.95)',
      borderColor: '#2a2a5a',
      textStyle: { color: '#ccc', fontSize: 11 },
      formatter: function(params) {
        if (!params || params.length === 0) return '';
        const strike = params[0].axisValue;
        let html = `<b>行权价 ${strike}</b><br/>`;
        for (const p of params) {
          const v = p.value;
          // category轴下 value 是纯数值
          if (v != null && !isNaN(v)) {
            const color = p.seriesName.includes('Call') ? '#00d4ff'
              : p.seriesName.includes('Put') ? '#ff6b9d'
              : p.seriesName.includes('15:00') ? '#8888ff' : '#ffaa00';
            html += `${p.seriesName}: <b style="color:${color}">${(v * 100).toFixed(2)}%</b><br/>`;
          }
        }
        return html;
      }
    },
    xAxis: {
      type: 'category',
      name: '行权价',
      nameTextStyle: { color: '#444', fontSize: 10 },
      axisLine: { lineStyle: { color: '#2a2a4a' } },
      axisTick: { show: false },
      axisLabel: { color: '#555', fontSize: 9, rotate: 45 },
      splitLine: { show: false },
      data: [],
    },
    yAxis: {
      type: 'value',
      name: '隐波 (%)',
      nameTextStyle: { color: '#444', fontSize: 10 },
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { color: '#555', fontSize: 9, formatter: v => (v * 100).toFixed(1) + '%' },
      splitLine: { lineStyle: { color: '#1a1a2a', type: 'dashed' } },
    },
    series: [
      { name: 'Call IV', type: 'scatter', symbol: 'circle', symbolSize: 6,
        itemStyle: { color: '#00d4ff', opacity: 0.6 }, data: [], z: 2 },
      { name: 'Put IV', type: 'scatter', symbol: 'circle', symbolSize: 6,
        itemStyle: { color: '#ff6b9d', opacity: 0.6 }, data: [], z: 2 },
      { name: '平滑曲线', type: 'line', smooth: 0.4, lineWidth: 2.5,
        itemStyle: { color: '#ffaa00' }, symbol: 'none', data: [], z: 3 },
      { name: '15:00收盘基准', type: 'line', smooth: 0.4, lineWidth: 2,
        lineStyle: { color: '#8888ff', type: 'dashed', opacity: 0.8 },
        symbol: 'none', data: [], z: 2 },
    ],
  });

  // 2. ATM IV 走势图
  const atmEl = document.getElementById('atmChart');
  const atmChart = echarts.init(atmEl, null, { renderer: 'canvas' });
  chartInstances.atm = atmChart;
  atmChart.setOption({
    ...chartTheme,
    grid: { top: 15, right: 15, bottom: 25, left: 50 },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', crossStyle: { color: '#555' } },
      backgroundColor: 'rgba(20,20,35,0.95)',
      borderColor: '#2a2a5a',
      textStyle: { color: '#ccc', fontSize: 11 },
      formatter: params => {
        const p = params[0];
        const v = p.value;
        const iv = (v != null && !isNaN(v)) ? (v * 100).toFixed(2) + '%' : '--';
        return `<b>${p.axisValue}</b><br/>ATM IV: <b style="color:#00ff88">${iv}</b>`;
      },
    },
    xAxis: {
      type: 'category',
      axisLine: { lineStyle: { color: '#2a2a4a' } },
      axisTick: { show: false },
      axisLabel: { color: '#444', fontSize: 8, interval: 4, rotate: 45 },
      splitLine: { show: false },
    },
    yAxis: {
      type: 'value', name: 'ATM IV (%)',
      nameTextStyle: { color: '#444', fontSize: 10 },
      axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: '#555', fontSize: 9 },
      splitLine: { lineStyle: { color: '#1a1a2a', type: 'dashed' } },
    },
    series: [{
      name: 'ATM IV', type: 'line', smooth: true, lineWidth: 2,
      itemStyle: { color: '#00ff88' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(0,255,136,0.3)' },
          { offset: 1, color: 'rgba(0,255,136,0.02)' }
        ])
      },
      symbol: 'circle', symbolSize: 4,
      data: [],
    }],
  });

  window.addEventListener('resize', () => {
    smileChart.resize();
    atmChart.resize();
  });
}

// ===================== 数据获取 & 更新 =====================
async function fetchData() {
  try {
    const [statusResp, curveResp, alertResp] = await Promise.all([
      fetch('/api/iv_smile/status'),
      fetch('/api/iv_smile/curve'),
      fetch('/api/iv_smile/alert_data'),
    ]);
    if (!statusResp.ok || !curveResp.ok || !alertResp.ok) { showError('API请求失败'); return; }

    const status = await statusResp.json();
    const data = await curveResp.json();
    const alertData = await alertResp.json();

    // ATM IV 走势图：每次 fetch 全量替换（后端已去重，数据量小无性能问题）
    if (status.atm_history && Object.keys(status.atm_history).length > 0) {
      _atmHistory = Object.entries(status.atm_history)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .filter(([time, value]) => typeof value === 'number' && !isNaN(value))
        .map(([time, value]) => ({ time, value }));
    }

    updateStatus(status, data);
    updateSmileChart(data);
    updateAtmChart(data);
    updateMetrics(data);
    updateTable(alertData, data);
    checkAndAlert(alertData);

    document.getElementById('lastUpdate').textContent =
      `最后更新: ${data.last_update || '--'} | 前次基准: ${data.prev_timestamp || '--'} | 版本 v2.11.3`;
  } catch (err) {
    showError('数据加载失败: ' + err.message);
  }
}

function updateStatus(status, data) {
  document.getElementById('fPrice').textContent = status.futures_price ? status.futures_price.toFixed(0) : '--';
  document.getElementById('atmStrikeTop').textContent = data.atm_strike || '--';
  document.getElementById('maxPain').textContent = data.max_pain || '--';
  document.getElementById('expiry').textContent = status.expiry ? new Date(status.expiry).toLocaleDateString('zh-CN') : '--';
  document.getElementById('prevTime').textContent = data.prev_timestamp || '--';

  const fPriceEl = document.getElementById('fPrice');
  fPriceEl.className = (!status.last_update || status.last_update === 'None') ? 'status-value warn' : 'status-value';
}

function updateSmileChart(data) {
  const chart = chartInstances.smile;
  if (!chart) return;
  const curve = data.curve || [];
  if (curve.length === 0) {
    chart.showLoading({ text: '暂无数据', color: '#444', textColor: '#444' });
    return;
  }
  chart.hideLoading();

  // 按行权价排序
  const sorted = [...curve].sort((a, b) => a.strike - b.strike);
  const strikes = sorted.map(d => String(d.strike));

  // 构建数据数组：对应 category 轴上每个 index 的值
  // category 轴的 series data 应为纯数值数组，与 xAxis.data 一一对应
  const callData = sorted.map(d => (d.raw_C != null && !isNaN(d.raw_C)) ? d.raw_C : null);
  const putData = sorted.map(d => (d.raw_P != null && !isNaN(d.raw_P)) ? d.raw_P : null);
  const smoothData = sorted.map(d => (d.smooth != null && !isNaN(d.smooth)) ? d.smooth : null);
  const prevData = sorted.map(d => (d.smooth_prev != null && !isNaN(d.smooth_prev)) ? d.smooth_prev : null);

  // 计算 y 轴范围
  const allVals = [...callData, ...putData, ...smoothData, ...prevData].filter(v => v != null);
  let yMin = Math.min(...allVals);
  let yMax = Math.max(...allVals);
  const padding = (yMax - yMin) * 0.1;
  yMin = Math.max(0, yMin - padding);
  yMax = yMax + padding;

  chart.setOption({
    xAxis: { data: strikes },
    yAxis: { min: parseFloat(yMin.toFixed(3)), max: parseFloat(yMax.toFixed(3)) },
    series: [
      { data: callData },
      { data: putData },
      { data: smoothData },
      { data: prevData },
    ],
  });
}

// 更新指标栏（1行4列）
function updateMetrics(data) {
  const curve = data.curve || [];
  if (curve.length === 0) return;

  const atmStrike = data.atm_strike;
  const atmItem = curve.find(d => d.strike === atmStrike);

  // ① ATM 隐波（SVI模型值 + 变化badge）
  const svi = data.svi_params;
  if (svi && svi.atm_vol != null) {
    const atmVal = (svi.atm_vol * 100).toFixed(2) + '%';
    document.getElementById('mAtmIv').textContent = atmVal;
  } else if (atmItem && atmItem.smooth != null) {
    document.getElementById('mAtmIv').textContent = (atmItem.smooth * 100).toFixed(2) + '%';
  }
  // ATM IV 变化 badge（放在sub行）
  if (atmItem && atmItem.smooth != null && atmItem.smooth_prev != null) {
    const diff = atmItem.smooth - atmItem.smooth_prev;
    const sign = diff >= 0 ? '+' : '';
    const badge = diff > 0.001 ? '<span class="badge badge-up">↑</span>'
      : diff < -0.001 ? '<span class="badge badge-down">↓</span>'
      : '<span class="badge badge-flat">—</span>';
    const diffEl = document.getElementById('mAtmDiffSub');
    diffEl.innerHTML = sign + (diff * 100).toFixed(2) + '% ' + badge;
    diffEl.style.color = diff > 0.001 ? '#ff4444' : diff < -0.001 ? '#00d4ff' : '#888';
  } else {
    document.getElementById('mAtmDiffSub').textContent = '无历史';
    document.getElementById('mAtmDiffSub').style.color = '#555';
  }

  // ② 偏斜度 Skew（SVI模型参数）
  if (svi && svi.skew != null) {
    const skewVal = svi.skew;
    const skewEl = document.getElementById('mSkewParam');
    skewEl.textContent = skewVal.toFixed(4);
    skewEl.style.color = skewVal < -0.1 ? '#00d4ff' : skewVal > 0.1 ? '#ff6b9d' : '#aaa';
    document.getElementById('mSkewSub').textContent =
      skewVal < -0.05 ? 'Put偏斜（左倾）' : skewVal > 0.05 ? 'Call偏斜（右倾）' : '基本对称';
  }

  // ③ 曲线形态（整体平移：升波/降波）
  let totalDiff = 0, count = 0;
  curve.forEach(d => {
    if (d.smooth != null && d.smooth_prev != null) {
      totalDiff += (d.smooth - d.smooth_prev);
      count++;
    }
  });
  if (count > 0) {
    const avgDiff = totalDiff / count * 100;
    const shapeEl = document.getElementById('mShape');
    shapeEl.textContent = (avgDiff >= 0 ? '+' : '') + avgDiff.toFixed(2) + '%';
    shapeEl.style.color = avgDiff > 0.05 ? '#ff4444' : avgDiff < -0.05 ? '#00d4ff' : '#aaffaa';
    document.getElementById('mShapeSub').textContent =
      avgDiff > 0.05 ? '整体升波' : avgDiff < -0.05 ? '整体降波' : '基本持平';
  }

  // ④ 曲率 Curvature（SVI模型二阶导）
  if (svi && svi.curvature != null) {
    const curv = svi.curvature;
    const curvEl = document.getElementById('mCurvature');
    curvEl.textContent = curv.toFixed(2);
    curvEl.style.color = curv > 30 ? '#ff6b9d' : curv > 10 ? '#ffaa00' : '#aaffaa';
    document.getElementById('mCurvSub').textContent =
      curv > 30 ? '陡峭（情绪紧张）' : curv > 10 ? '适中' : '平坦（情绪平稳）';
  }

  // ⑤ 拟合残差 RMSE
  if (curve.length > 0) {
    let ssq = 0, n = 0;
    curve.forEach(d => {
      if (d.smooth != null) {
        if (d.raw_C != null && !isNaN(d.raw_C)) { ssq += (d.smooth - d.raw_C) ** 2; n++; }
        if (d.raw_P != null && !isNaN(d.raw_P)) { ssq += (d.smooth - d.raw_P) ** 2; n++; }
      }
    });
    if (n > 0) {
      const rmse = Math.sqrt(ssq / n) * 100;
      const fitEl = document.getElementById('mFitErr');
      fitEl.textContent = rmse.toFixed(2) + '%';
      fitEl.style.color = rmse < 1 ? '#00ff88' : rmse < 3 ? '#ffaa00' : '#ff4444';
    }
  }
}

// ===================== T型表格（使用 alert_data API）=====================
function updateTable(alertData, curveData) {
  const rows = alertData.rows || [];
  const tbody = document.getElementById('tBody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#444;height:80px;">暂无数据</td></tr>';
    return;
  }

  const atmStrike = curveData.atm_strike;
  const hasBaseline = alertData.has_baseline;

  // 格式化IV值（百分比，保留2位）
  const fmtIv = (v, cls) => {
    if (v == null || v === 0) return '<span style="color:#333">--</span>';
    return `<span class="${cls}">${v.toFixed(2)}%</span>`;
  };

  // 格式化IV变化（统一字体颜色，达阈值用背景色块标注）
  const fmtIvChg = (chg, level, refType) => {
    if (chg == null) return '<span style="color:#333">--</span>';
    const sign = chg >= 0 ? '+' : '';
    const text = `${sign}${chg.toFixed(2)}%`;

    // 反转类型 → 在正常色块基础上叠加闪烁
    if (refType === 'reversal') {
      if (level === 'major') return `<span class="alert-major alert-reversal-pulse">⚡${text}</span>`;
      if (level === 'significant') return `<span class="alert-significant alert-reversal-pulse">⚡${text}</span>`;
      return `<span class="alert-reversal">⚡${text}</span>`;
    }
    // 达到阈值 → 背景色块
    if (level === 'major') return `<span class="alert-major">${text}</span>`;
    if (level === 'significant') return `<span class="alert-significant">${text}</span>`;

    // 普通 → 统一灰白色
    return `<span style="color:#aaa">${text}</span>`;
  };

  // 格式化持仓变化（百分比，统一字体颜色，达阈值用背景色块）
  const fmtOiChg = (current, prev, level) => {
    const cur = current || 0;
    const prv = prev || 0;
    // 都为0，显示 --
    if (cur === 0 && prv === 0) {
      return '<span style="color:#333">--</span>';
    }
    // 有基准无当前（非交易时段），变化为0
    if (cur === 0 && prv > 0) {
      return '<span style="color:#555">0</span>';
    }
    // 有当前无基准，无法计算变化
    if (prv === 0) {
      return '<span style="color:#333">--</span>';
    }
    // 正常：都有值，计算百分比变化
    const chg = (cur - prv) / prv;
    const pct = (chg * 100).toFixed(1);
    const sign = chg >= 0 ? '+' : '';
    const text = `${sign}${pct}%`;

    // 达到阈值 → 背景色块
    if (level === 'major') return `<span class="alert-major">${text}</span>`;
    if (level === 'significant') return `<span class="alert-significant">${text}</span>`;

    // 普通 → 统一灰白色
    return `<span style="color:#aaa">${text}</span>`;
  };

  // 格式化持仓量
  const fmtOi = (oi, prev) => {
    if (oi != null && oi > 0) return oi.toLocaleString();
    // 非交易时段当前OI=0，直接显示基准OI
    if (prev != null && prev > 0) return `<span style="color:#555">${prev.toLocaleString()}</span>`;
    return '<span style="color:#333">--</span>';
  };

  const html = rows.map(r => {
    const isAtm = r.strike === atmStrike;
    const star = isAtm ? '<span class="star">★</span>' : '';
    const trCls = isAtm ? 'class="atm-row"' : '';

    // Call IV 变化：使用当前Call IV vs 前次Call IV
    const callIvChg = (r.iv_call != null && r.iv_call_prev != null)
      ? r.iv_call - r.iv_call_prev : null;
    // Put IV 变化：使用当前Put IV vs 前次Put IV
    const putIvChg = (r.iv_put != null && r.iv_put_prev != null)
      ? r.iv_put - r.iv_put_prev : null;

    return `<tr ${trCls}>
      <td>${fmtOiChg(r.oi_call, r.oi_call_prev, r.oi_call_level)}</td>
      <td>${fmtOi(r.oi_call, r.oi_call_prev)}</td>
      <td>${fmtIvChg(callIvChg, r.iv_call_level, r.iv_ref_type)}</td>
      <td>${fmtIv(r.iv_call, 'iv-call')}</td>
      <td>${star}${r.strike}</td>
      <td>${fmtIv(r.iv_put, 'iv-put')}</td>
      <td>${fmtIvChg(putIvChg, r.iv_put_level, r.iv_ref_type)}</td>
      <td>${fmtOi(r.oi_put, r.oi_put_prev)}</td>
      <td>${fmtOiChg(r.oi_put, r.oi_put_prev, r.oi_put_level)}</td>
    </tr>`;
  }).join('');

  tbody.innerHTML = html;
}

function showError(msg) { console.error(msg); }

async function triggerCalc() {

    const resp = await fetch('/api/iv_smile/trigger', { method: 'POST' });

    if (result.success) await fetchData();
    else alert('刷新失败，请检查服务状态');
  } catch (e) { alert('请求失败: ' + e.message); }
}

// ===================== 声音报警系统（Web Audio API）=====================
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

// 显著异动：短促双音 (440Hz + 660Hz)，音量0.5
function playSoundSignificant() {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    [440, 660].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.5, t + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.12);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t + i * 0.15);
      osc.stop(t + i * 0.15 + 0.15);
    });
  } catch (e) { console.warn('Sound failed:', e); }
}

// 重大异动：急促三连音 (880Hz × 3)，音量0.6
function playSoundMajor() {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.6, t + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.12);
    }
  } catch (e) { console.warn('Sound failed:', e); }
}

// 盘中反转：下行滑音 (1200→600Hz)，音量0.6
function playSoundReversal() {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1200, t);
    osc.frequency.exponentialRampToValueAtTime(600, t + 0.4);
    gain.gain.setValueAtTime(0.6, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.5);
  } catch (e) { console.warn('Sound failed:', e); }
}

// ===================== Toast 弹窗系统 =====================
let _toastContainer = null;
function getToastContainer() {
  if (!_toastContainer) {
    _toastContainer = document.createElement('div');
    _toastContainer.className = 'toast-container';
    document.body.appendChild(_toastContainer);
  }
  return _toastContainer;
}

function showToast(title, detail, level) {
  const container = getToastContainer();
  const toast = document.createElement('div');
  toast.className = 'toast ' + level;  // significant / major / reversal
  toast.innerHTML = `<div class="toast-title">${title}<span class="toast-close">✕</span></div><div class="toast-detail">${detail}</div>`;
  toast.querySelector('.toast-close').addEventListener('click', (e) => { e.stopPropagation(); toast.remove(); });
  container.appendChild(toast);
  // 不自动消失，需手动点击 ✕ 关闭
}

// ===================== 异动检测与报警 =====================
let _lastAlertKeys = null;  // null = 首次加载尚未初始化
let _alertSoundEnabled = false;  // 页面需要用户交互后才能播放声音

function checkAndAlert(alertData) {
  const alerts = alertData.iv_alerts || [];
  const newKeys = new Set();

  alerts.forEach(a => {
    const key = `${a.strike}_${a.level}_${a.ref_type || 'close'}`;
    newKeys.add(key);
  });

  // 首次加载：只记录当前状态，不弹窗不响铃
  if (_lastAlertKeys === null) {
    _lastAlertKeys = newKeys;
    console.log(`[Alert] 初始化完成，记录${newKeys.size}个异动状态`);
    return;
  }

  // 后续轮询：只对新出现的key弹窗
  let alertCount = 0;
  alerts.forEach(a => {
    const key = `${a.strike}_${a.level}_${a.ref_type || 'close'}`;
    if (_lastAlertKeys.has(key)) return;  // 已报过

    alertCount++;
    // 最多弹5个toast，防止刷屏
    if (alertCount > 5) return;

    const isReversal = a.ref_type === 'reversal';
    const levelText = isReversal ? '⚡盘中反转' : a.level === 'major' ? '🔴重大异动' : '🟡显著异动';
    const title = `${levelText} — K${a.strike}`;
    const chgText = a.iv_chg != null ? (a.iv_chg >= 0 ? '+' : '') + a.iv_chg.toFixed(2) + '%' : '';
    const detail = `IV变化: ${chgText}`;

    // Toast
    const toastLevel = isReversal ? 'reversal' : a.level === 'major' ? 'major' : 'significant';
    showToast(title, detail, toastLevel);

    // 声音（只响一次，取最高级别）
    if (alertCount === 1) {
      if (isReversal) playSoundReversal();
      else if (a.level === 'major') playSoundMajor();
      else playSoundSignificant();
    }
  });

  if (alertCount > 5) {
    showToast(`还有 ${alertCount - 5} 个异动`, '查看T型表格了解详情', 'significant');
  }

  _lastAlertKeys = newKeys;
}
